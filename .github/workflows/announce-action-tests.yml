name: Announce action tests

on:
  pull_request:
    paths:
      - ".github/actions/announce/**"
      - ".github/workflows/reusable-announce-*.yml"
  push:
    branches:
      - main
    paths:
      - ".github/actions/announce/**"
      - ".github/workflows/reusable-announce-*.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: 📣 Announce action tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js v24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The action is dependency-free TypeScript run through Node.js type stripping.
      - name: Run tests
        run: node --test '.github/actions/announce/test/*.test.ts'
