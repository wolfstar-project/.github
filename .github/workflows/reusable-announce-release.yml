name: Announce release

# Has the Pullfrog agent write a Discord announcement for a bot or site release
# from the pull requests in it, then posts it once a maintainer approves the
# caller's environment (add required reviewers to it). The draft job summary
# shows the preview to review. Call it after the job that tags the release:
#
#   announce:
#     needs: tag
#     permissions:
#       contents: read
#       pull-requests: read
#       id-token: write # Pullfrog authenticates with OIDC
#     uses: wolfstar-project/.github/.github/workflows/reusable-announce-release.yml@main
#     with:
#       kind: bot
#       product: WolfStar Alpha
#       version: ${{ needs.tag.outputs.tag }}
#       from-ref: ${{ needs.tag.outputs.from }}
#     secrets:
#       DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
#       ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#
# See `.github/actions/announce/README.md`.
on:
  workflow_call:
    inputs:
      dry-run:
        description: Draft and render into the job summary, but never post.
        type: boolean
        default: false
      environment:
        description: The environment the post job waits on. Add required reviewers to it.
        type: string
        default: discord-announcements
      kind:
        description: "`bot` or `site`."
        type: string
        default: bot
      product:
        description: "The name readers know, such as `WolfStar Alpha`."
        type: string
        default: ""
      version:
        description: The version or tag being announced.
        type: string
        default: ""
      from-ref:
        description: The previous release tag or commit.
        type: string
        default: ""
      to-ref:
        description: The tag or commit being released.
        type: string
        default: ""
      stage:
        description: "`alpha`, `beta`, `preview`, `stable`, or `hotfix`."
        type: string
        default: stable
      format:
        description: "`auto`, `text`, or `components`."
        type: string
        default: auto
      notes:
        description: Facts the pull requests do not say.
        type: string
        default: ""
      language:
        description: The language of the announcement.
        type: string
        default: English
      include-open-pulls:
        description: Read open pull requests for Coming soon.
        type: boolean
        default: true
      max-screenshots:
        description: The most After screenshots of a site announcement.
        type: string
        default: "3"
      ai-model:
        description: Pullfrog model override. Empty uses the repository setting.
        type: string
        default: ""
      ai-effort:
        description: Pullfrog reasoning effort.
        type: string
        default: medium
      ai-timeout:
        description: How long the agent may take.
        type: string
        default: 15m
      role-id:
        description: The role pinged by the first message.
        type: string
        default: ""
      thread-id:
        description: Post into this thread of a forum or media channel.
        type: string
        default: ""
      username:
        description: Override the webhook's display name.
        type: string
        default: ""
      avatar-url:
        description: Override the webhook's avatar.
        type: string
        default: ""
      button-label:
        description: Label of the link button.
        type: string
        default: ""
      button-url:
        description: Target of the link button.
        type: string
        default: ""
      release-url:
        description: GitHub release page, linked from a second button.
        type: string
        default: ""
    secrets:
      DISCORD_WEBHOOK_URL:
        description: The Discord webhook of the announcement channel. Without it nothing is sent.
        required: false
      ANTHROPIC_API_KEY:
        description: A provider key for Pullfrog.
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: A Claude subscription token for Pullfrog.
        required: false
      RELEASE_WEBHOOK_URL:
        description: Optional HTTPS endpoint for signed lifecycle callbacks.
        required: false
      RELEASE_WEBHOOK_SECRET:
        description: HMAC key for the callbacks.
        required: false

permissions: {}

jobs:
  draft:
    name: ✍️ Draft the announcement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read # pull request bodies and PR evidence comments
      id-token: write # Pullfrog authenticates with OIDC
    outputs:
      skipped: ${{ steps.announce.outputs.skipped }}
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Draft
        id: announce
        uses: wolfstar-project/.github/.github/actions/announce@main
        with:
          mode: draft
          kind: ${{ inputs.kind }}
          product: ${{ inputs.product }}
          version: ${{ inputs.version }}
          from-ref: ${{ inputs.from-ref }}
          to-ref: ${{ inputs.to-ref || github.sha }}
          stage: ${{ inputs.stage }}
          format: ${{ inputs.format }}
          notes: ${{ inputs.notes }}
          language: ${{ inputs.language }}
          include-open-pulls: ${{ inputs.include-open-pulls }}
          max-screenshots: ${{ inputs.max-screenshots }}
          ai-model: ${{ inputs.ai-model }}
          ai-effort: ${{ inputs.ai-effort }}
          ai-timeout: ${{ inputs.ai-timeout }}
          output-dir: ${{ runner.temp }}/announcement
          role-id: ${{ inputs.role-id }}
          username: ${{ inputs.username }}
          avatar-url: ${{ inputs.avatar-url }}
          button-label: ${{ inputs.button-label }}
          button-url: ${{ inputs.button-url }}
          release-url: ${{ inputs.release-url }}
          callback-url: ${{ secrets.RELEASE_WEBHOOK_URL }}
          callback-secret: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
        env:
          # Pullfrog reads the provider key from the environment of this step.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Keep the draft for the post job
        if: steps.announce.outputs.skipped != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: announcement
          path: ${{ runner.temp }}/announcement
          retention-days: 7

  post:
    name: 📣 Post to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: draft
    if: ${{ !inputs.dry-run && needs.draft.outputs.skipped != 'true' }}
    # The run waits here until a required reviewer of the caller's environment
    # has read the preview in the draft job summary and approved.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Download the draft
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: announcement
          path: ${{ runner.temp }}/announcement

      - name: Post
        uses: wolfstar-project/.github/.github/actions/announce@main
        with:
          mode: post
          kind: ${{ inputs.kind }}
          output-dir: ${{ runner.temp }}/announcement
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          thread-id: ${{ inputs.thread-id }}
          callback-url: ${{ secrets.RELEASE_WEBHOOK_URL }}
          callback-secret: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
